[project]
name = "retail-demand-staffing-optimizer"
version = "1.0.0"
description = "Moving-average demand forecasts and staffing plans per store (FastAPI + SQLAlchemy + Alembic + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "SQLAlchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.py", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Starlette 1.x prefers httpx2 for TestClient; this is the only warning tolerated.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
